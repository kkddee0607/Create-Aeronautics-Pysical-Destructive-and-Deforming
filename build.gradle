plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

group = 'com.physicaldestroydeform'
version = '0.1.3'

base { archivesName = 'physical-destroy-deform' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.172'
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods {
        physical_destroy_deform { sourceSet sourceSets.main }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes([
            'Specification-Title': 'Physical Destruction and Deforming',
            'Specification-Version': '0.1.3',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version
        ])
    }
}
