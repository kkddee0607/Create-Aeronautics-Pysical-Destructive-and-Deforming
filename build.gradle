plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

group = 'com.physicaldestroydeform'
version = '0.6.1-duoMoreFix'
base { archivesName = 'physical-destroy-deform' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = '21.1.228'
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods {
        physical_destroy_deform { sourceSet sourceSets.main }
    }
}
repositories {
    mavenCentral()
    exclusiveContent {
        forRepository { maven { url = 'https://maven.ryanhcode.dev/releases' } }
        filter {
            includeGroup 'dev.ryanhcode.sable'
            includeGroup 'dev.ryanhcode.sable-companion'
        }
    }
}
dependencies {
    // Official Sable developer Maven: API only; do not bundle Sable into PDD.
    compileOnly('dev.ryanhcode.sable:sable-common-1.21.1:2.0.6') { transitive = false }
    testImplementation('dev.ryanhcode.sable:sable-common-1.21.1:2.0.6') { transitive = false }
    // CollisionResult.NONE initializes JOMLConversion.ZERO from Sable Companion.
    // Compile-only Sable API does not place this required class on the JUnit runtime path.
    compileOnly('dev.ryanhcode.sable-companion:sable-companion-common-1.21.1:1.6.0') { transitive = false }
    testRuntimeOnly('dev.ryanhcode.sable-companion:sable-companion-common-1.21.1:1.6.0') { transitive = false }
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'org.slf4j:slf4j-api:2.0.16'
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.16'
}
// NeoForge ModDev supplies Minecraft/JOML to the main source set.
// The callback unit tests also reference those API types directly.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath
// ModDevGradle makes the patched Minecraft/JOML artifacts available on main compileClasspath.
// Plain JUnit also needs them at runtime to instantiate BlockPos and Vector3d.
sourceSets.test.runtimeClasspath += sourceSets.main.compileClasspath

tasks.named('test', Test).configure {
    useJUnitPlatform()
    // Regression fixtures explicitly exercise the opt-in observation path; production defaults OFF.
    systemProperty 'pdd.logs', 'contact,force,commit,stress,copycat' 
    reports.junitXml.required = true
    afterSuite { descriptor, result ->
        if (!descriptor.parent) logger.lifecycle("PDD JUnit: total=${result.testCount} passed=${result.successfulTestCount} failed=${result.failedTestCount} skipped=${result.skippedTestCount}")
    }
    // CI retains the same JUnit gate; print the expected/actual assertion detail on failure.
    testLogging {
        events 'failed', 'skipped'
        showExceptions = true
        showCauses = true
        exceptionFormat = 'full'
    }
}
jar {
    // Preserve the 0.6.1 save schema; display the fix release in the JAR and NeoForge mods list.
    archiveClassifier.set('')
    manifest {
        attributes([
            'Specification-Title': 'Physical Destruction and Deforming',
            'Specification-Version': '0.6.1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'PDD-Revision': '0.6.1-duoMoreFix'
        ])
    }
}
